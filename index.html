        <g class="session-effect session-thrusters" fill="#84DFE3">
          <path d="M10 43H14L13 48H11ZM26 43H30L29 48H27Z"/>
          <path fill="#F8EBCD" d="M11 43H13V46H11ZM27 43H29V46H27Z"/>
        </g>
        <g class="session-effect session-ripple" fill="none" stroke="var(--accent)" stroke-width=".6">
          <ellipse cx="20" cy="44" rx="15" ry="2"/>
        </g>
        <g class="session-effect session-bats" fill="#887494">
          <path d="M3 7L6 4L8 6L9 5L10 6L12 4L15 7L12 6L10 9H8L6 6ZM27 4L30 1L32 3L33 2L34 3L36 1L39 4L36 3L34 6H32L30 3Z"/>
        </g>
        <g class="dragon-fire">
          <path fill="#EF8047" d="M34 16L37 13L36 10L40 5L39 12L40 14L38 17L40 22L36 20L35 18Z"/>
          <path fill="#FFDC83" d="M35 16L38 13L38 10L39 8L39 14L37 17L38 19L36 18Z"/>
          <path fill="#FFF1CD" d="M35 16L37 15L37 18L36 17Z"/>
        </g>
        <g class="dragon-embers" fill="#FFD984">
          <path d="M29 4H30V5H29ZM35 2H36V4H35ZM38 8H39V9H38ZM32 8H33V9H32ZM25 7H26V8H25ZM37 23H38V24H37Z"/>
        </g>
      </svg>
      <div class="avatar-smoke" aria-hidden="true"><span class="smoke-cloud"></span><span class="smoke-cloud"></span><span class="smoke-cloud"></span><span class="smoke-cloud"></span><span class="smoke-cloud"></span><span class="smoke-cloud"></span></div>
      <section class="display" aria-label="Countdown">
        <span id="mode">READY TO FOCUS</span>
        <output id="countdown" aria-label="Remaining time">25:00</output>
        <p id="current-label" title="One thing at a time.">One thing at a time.</p>
        <progress id="progress" value="0" max="1" aria-label="Session progress"></progress>
      </section>
    </div>
    <button id="settings-toggle" type="button" aria-label="Timer settings" aria-expanded="false" aria-controls="settings-panel" title="Timer settings">⚙</button>
    <section id="settings-panel" class="preferences" aria-label="Timer settings" hidden>
      <header class="panel-heading"><h1><span aria-hidden="true">✦</span> Buddy settings</h1><button id="dismiss-settings" type="button" aria-label="Close settings">×</button></header>
      <button id="dial-toggle" class="watch-launcher" type="button" aria-label="Open avatar dial" aria-expanded="false" aria-controls="buddy-dial">
        <svg class="watch-symbol" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="18" fill="#201C30" stroke="#6CC9AD" stroke-width="2"/>
          <g fill="#9CF1B8">
            <path d="M20 6A14 14 0 0 1 32 13L27 15A9 9 0 0 0 20 11Z"/>
            <path d="M20 6A14 14 0 0 1 32 13L27 15A9 9 0 0 0 20 11Z" transform="rotate(120 20 20)"/>
            <path d="M20 6A14 14 0 0 1 32 13L27 15A9 9 0 0 0 20 11Z" transform="rotate(240 20 20)"/>
          </g>
          <path d="M20 15L25 20L20 25L15 20Z" fill="#84DFE3"/>
          <circle cx="20" cy="20" r="2" fill="#E5FFE3"/>
        </svg>
        <span>Choose your buddy<strong id="selected-buddy-name">Avocado</strong></span>
        <span class="watch-chevron" aria-hidden="true">⌁</span>
      </button>
      <dialog id="buddy-dial" class="dial-overlay" aria-labelledby="dial-title">
        <header class="dial-heading"><strong id="dial-title">Choose your buddy</strong><button id="dismiss-dial" type="button" aria-label="Close avatar dial">×</button></header>
        <div class="orbital-dial">
          <div class="buddy-picker" role="group" aria-label="Choose your buddy"></div>
          <button id="confirm-buddy" class="dial-hub" type="button" aria-label="Select previewed buddy">
            <span id="stage-preview"></span><strong id="buddy-name"></strong><span id="buddy-series"></span>
          </button>
        </div>
        <div class="dial-controls"><button id="previous-buddy" type="button" aria-label="Previous character">◀</button><span>Hover to preview<br>Click to transform</span><button id="next-buddy" type="button" aria-label="Next character">▶</button></div>
      </dialog>
      <label class="animation-control" for="animation-mode">Animations<select id="animation-mode"><option value="full">On</option><option value="system">Follow system</option><option value="reduced">Off</option></select></label>
      <form id="timer-form">
        <div class="inputs">
          <label class="duration-field" for="minutes">Focus duration <span>(minutes)</span></label>
          <div class="duration-stepper"><button id="less-time" type="button" aria-label="Decrease duration by five minutes">−</button><input id="minutes" type="number" min="1" max="240" step="1" value="25" required disabled><button id="more-time" type="button" aria-label="Increase duration by five minutes">+</button></div>
          <input id="duration-slider" type="range" min="1" max="240" step="1" value="25" aria-label="Adjust focus duration">
          <div class="presets" role="group" aria-label="Quick durations"><button type="button" data-minutes="5">5 min</button><button type="button" data-minutes="25">25 min</button><button type="button" data-minutes="50">50 min</button></div>
          <label class="label-field" for="label">Working on <span>(optional)</span><input id="label" type="text" maxlength="200" placeholder="e.g. film prep" autocomplete="off" disabled></label>
        </div>
        <div class="controls"><button id="start" type="submit" class="primary" disabled>Start</button><button id="pause" type="button" disabled>Pause</button><button id="reset" type="button" disabled>Reset</button></div>
      </form>
      <div class="status-row"><p id="status" role="status" aria-live="polite">Sessions save to your log folder.</p><button id="retry" type="button" hidden>Retry save</button></div>
      <button id="close" type="button" title="Close and pause timer">Close timer</button>
    </section>
  </main>
  <audio id="completion-sound" src="completion.wav" preload="auto"></audio>
</body>
</html>
